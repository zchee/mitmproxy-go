          jq -se --arg package github.com/zchee/mitmproxy-go/internal/tools/console/acceptance --arg parent TestConsoleOracle --argjson expected '[
            "TestConsoleOracle",
            "TestConsoleOracle/oracle",
            "TestConsoleOracle/oracle/flowlist",
            "TestConsoleOracle/oracle/flowlist/80x24",
            "TestConsoleOracle/oracle/flowview",
            "TestConsoleOracle/oracle/flowview/80x24",
            "TestConsoleOracle/oracle/commander",
            "TestConsoleOracle/oracle/commander/80x24"
          ]' '
            . as $rows
            | [ $rows[] | select(.Package == $package and .Test? != null)
                | select(.Test == $parent or (.Test | startswith($parent + "/")))
                | select(.Action == "run" or .Action == "pass" or .Action == "fail" or .Action == "skip") ] as $events
            | (reduce $events[] as $event ({}; .[$event.Test][$event.Action] = ((.[$event.Test][$event.Action] // 0) + 1))) as $counts
            | if (($counts | keys | sort) == ($expected | sort))
                and all($counts[]; .run == 1 and .pass == 1 and (.fail // 0) == 0 and (.skip // 0) == 0)
                and ([ $rows[] | select(.Package == $package and .Test? == null and .Action == "pass") ] | length) == 1
                and ([ $rows[] | select(.Package == $package and (.Action == "fail" or .Action == "skip")) ] | length) == 0
              then $counts else error("console oracle identity/count mismatch") end
          ' "$GITHUB_WORKSPACE/_test/web-differential/all-tagged.jsonl" >| "$OUT/oracle-tallies.json"
          printf 'end=%s\nreader_exit=0\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$OUT/oracle-reader.receipt"
      - name: Verify complete mitmweb differential evidence
