name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Windows runners default to pwsh; every step is written for bash.
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
          # Windows runs are paused on the maintainer's decision (2026-10-16);
          # the leg returns with the deferred Windows work (transparent refusal
          # identity, SOCKS5 refusal-reply drain).
          # - windows-2025
        go:
          - stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: test
      - name: Record scripting test build context
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/script"
          mkdir -p "$OUT"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/native-context.receipt"
          go version >| "$OUT/go-version.txt"
          printf 'host=%s\n' "$(uname -sm)" >> "$OUT/native-context.receipt"
      # go test compiles every package and runs the default vet checks; the
      # explicit vet keeps the full analyzer set that the build job used to run.
      - name: go vet
        run: go vet ./...
      - name: go test -race with skip report
        env:
          TEST_SKIPS_ENFORCE: "on"
        run: |
          set -euo pipefail
          # Capture both statuses so producer failure is never hidden by the reader.
          set +e
          go test -race -count=1 -json ./... | bash hack/test-skips.sh
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'go-test-producer=%s skip-reader=%s\n' "${statuses[0]}" "${statuses[1]}"
          (( statuses[1] == 0 )) || exit "${statuses[1]}"
          exit "${statuses[0]}"
      - name: Verify native PF lookup contracts
        if: matrix.os == 'xcode-27'
        run: |
          set -euo pipefail
          names=(TestOriginalDestinationAddress TestPFStateLookup TestOriginalDestinationFailures TestOriginalDestinationPFSelfCheck)
          pattern='^(TestOriginalDestinationAddress|TestPFStateLookup|TestOriginalDestinationFailures|TestOriginalDestinationPFSelfCheck)$'
          mkdir -p _test/platform
          go test -race -list "${pattern}" ./internal/platform | tee _test/platform/pf-inventory.txt
          diff -u <(printf '%s\n' "${names[@]}" | sort) <(grep '^Test' _test/platform/pf-inventory.txt | sort)
          go test -race -count=1 -v -run "${pattern}" ./internal/platform | tee _test/platform/pf.log
          if grep -Eq '^[[:space:]]*--- SKIP:' _test/platform/pf.log; then
            exit 1
          fi
          for name in "${names[@]}"; do
            grep -Eq "^--- PASS: ${name} " _test/platform/pf.log
          done

      - name: Verify frozen console frames
        timeout-minutes: 6
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/console/goldens"
          mkdir -p "$OUT"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/frames.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/frames.receipt"
            exit "$result"
          }
          trap finish EXIT
          go version >| "$OUT/go-version.txt"
          go env GOROOT >| "$OUT/goroot.txt"
          go test -race -timeout=3m -list '^TestConsoleGoldens$' ./internal/tools/console/acceptance >| "$OUT/parents.txt"
          diff -u <(printf '%s\n' TestConsoleGoldens) <(grep '^Test' "$OUT/parents.txt")
          go test -race -count=1 -cpu=1 -timeout=3m -json -run '^TestConsoleGoldens$/^frames$/^(flowlist|flowview|commander)$/^(80x24|200x50)$' ./internal/tools/console/acceptance >| "$OUT/frames.jsonl" 2>| "$OUT/frames.stderr"
          jq -se '
            . as $rows
            | ["TestConsoleGoldens", "TestConsoleGoldens/frames"] +
              [ ["flowlist", "flowview", "commander"][] as $state
                | "TestConsoleGoldens/frames/" + $state,
                  ("TestConsoleGoldens/frames/" + $state + "/80x24"),
                  ("TestConsoleGoldens/frames/" + $state + "/200x50") ] as $expected
            | (reduce ($rows[] | select(.Test? != null and (.Action == "run" or .Action == "pass" or .Action == "fail" or .Action == "skip"))) as $event
                ({}; .[$event.Test][$event.Action] = ((.[$event.Test][$event.Action] // 0) + 1))) as $counts
            | if (($counts | keys | sort) == ($expected | sort))
                and all($counts[]; .run == 1 and .pass == 1 and (.fail // 0) == 0 and (.skip // 0) == 0)
                and ([ $rows[] | select(.Test? == null and .Action == "pass") ] | length) == 1
                and ([ $rows[] | select(.Action == "fail" or .Action == "skip") ] | length) == 0
              then $counts else error("console frame identity/count mismatch") end
          ' "$OUT/frames.jsonl" >| "$OUT/tallies.json"
      - name: Verify timed console storm
        if: matrix.os == 'ubuntu-26.04'
        run: |
          set -euo pipefail
          # The local gate wrapper is a cross-worker mutex, not needed on a dedicated runner.
          OUT="$GITHUB_WORKSPACE/_test/console/storm"
          mkdir -p "$OUT"
          export MITMPROXY_TEST_CONSOLE_ARTIFACTS="$OUT"
          go version >| "$OUT/go-version.txt"
          go env GOROOT >| "$OUT/goroot.txt"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/storm.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/storm.receipt"
            exit "$result"
          }
          trap finish EXIT
          timeout --signal=QUIT --kill-after=15s 5m go test -tags consolestorm -timeout=3m -list '^TestConsoleStorm$' ./internal/tools/console/acceptance >| "$OUT/parents.txt"
          diff -u <(printf '%s\n' TestConsoleStorm) <(grep '^Test' "$OUT/parents.txt")
          for count in 1 5; do
            pattern='^TestConsoleStorm$'
            if test "$count" -eq 1; then pattern='^TestConsoleStorm$/^update_blocked_two_seconds$'; fi
            timeout --signal=QUIT --kill-after=15s 5m go test -tags consolestorm -count="$count" -cpu=1 -timeout=3m -json ./internal/tools/console/acceptance -run "$pattern" >| "$OUT/storm-$count.jsonl" 2>| "$OUT/storm-$count.stderr"
            jq -se --argjson count "$count" '
              . as $rows
              | [ .[] | select(.Test? != null and (.Action == "run" or .Action == "pass" or .Action == "fail" or .Action == "skip")) ] as $events
              | (reduce $events[] as $event ({}; .[$event.Test][$event.Action] = ((.[$event.Test][$event.Action] // 0) + 1))) as $counts
              | if (($counts | keys | sort) == (["TestConsoleStorm", "TestConsoleStorm/update_blocked_two_seconds"] | sort))
                and all($counts[]; .run == $count and .pass == $count and (.fail // 0) == 0 and (.skip // 0) == 0)
                and ([ $rows[] | select(.Test? == null and .Action == "pass") ] | length) == 1
                and ([ $rows[] | select(.Action == "fail" or .Action == "skip") ] | length) == 0
                then $counts else error("console storm identity/count mismatch") end
            ' "$OUT/storm-$count.jsonl" >| "$OUT/tallies-$count.json"
          done
      - name: Provision tagged console quality tools
        if: matrix.os == 'ubuntu-26.04'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/console/quality"
          BINDIR="$RUNNER_TEMP/console-quality-tools"
          mkdir -p "$BINDIR" "$OUT"
          printf 'start=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/tools.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/tools.receipt"
            exit "$result"
          }
          trap finish EXIT
          install_tool() {
            local name="$1" package="$2"
            if GODEBUG=http2client=0 GOBIN="$BINDIR" timeout --signal=QUIT --kill-after=15s 5m go install "$package" >| "$OUT/$name-install.log" 2>&1; then
              printf '%s_install_attempt=1\n' "$name" >> "$OUT/tools.receipt"
              return 0
            fi
            sleep 2
            GODEBUG=http2client=0 GOBIN="$BINDIR" timeout --signal=QUIT --kill-after=15s 5m go install "$package" >| "$OUT/$name-install.retry.log" 2>&1
            printf '%s_install_attempt=2\n' "$name" >> "$OUT/tools.receipt"
          }
          install_tool gopls golang.org/x/tools/gopls@v0.24.0
          install_tool lint github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$BINDIR/gopls" version >| "$OUT/gopls.version"
          "$BINDIR/golangci-lint" version >| "$OUT/golangci-lint.version"
          sha256sum "$BINDIR/gopls" "$BINDIR/golangci-lint" >| "$OUT/tools.SHA256SUMS"
      - name: Verify tagged console diagnostics
        if: matrix.os == 'ubuntu-26.04'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/console/quality"
          BINDIR="$RUNNER_TEMP/console-quality-tools"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/diagnostics.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/diagnostics.receipt"
            exit "$result"
          }
          trap finish EXIT
          timeout --signal=QUIT --kill-after=15s 5m go vet -tags consolestorm ./internal/tools/console/acceptance >| "$OUT/vet.log" 2>&1
          timeout --signal=QUIT --kill-after=15s 5m "$BINDIR/golangci-lint" run --allow-parallel-runners --issues-exit-code=1 --build-tags consolestorm ./internal/tools/console/acceptance >| "$OUT/lint.log" 2>&1
          GOFLAGS=-tags=consolestorm timeout --signal=QUIT --kill-after=15s 5m "$BINDIR/gopls" check internal/tools/console/acceptance/storm_linux_test.go >| "$OUT/gopls.log" 2>| "$OUT/gopls.stderr"
          test ! -s "$OUT/gopls.log"
      - name: Verify scripting timing contracts
        if: matrix.os == 'ubuntu-26.04'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/script/timing"
          mkdir -p "$OUT"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/timing.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/timing.receipt"
            exit "$result"
          }
          trap finish EXIT
          go test -race -tags scripttiming -timeout=10m -list '^TestScriptTiming$' ./script/acceptance >| "$OUT/parents.txt" 2>| "$OUT/parents.stderr"
          diff -u <(printf '%s\n' TestScriptTiming) <(grep '^Test' "$OUT/parents.txt")
          for count in 1 5; do
            printf '%q ' go test -race -tags scripttiming -count="$count" -cpu=1 -timeout=20m -json -run '^TestScriptTiming$' ./script/acceptance >| "$OUT/command-$count.txt"
            printf '\nstart=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$OUT/command-$count.txt"
            producer=0
            go test -race -tags scripttiming -count="$count" -cpu=1 -timeout=20m -json -run '^TestScriptTiming$' ./script/acceptance >| "$OUT/timing-$count.jsonl" 2>| "$OUT/timing-$count.stderr" || producer=$?
            reader=0
            jq -se --argjson count "$count" '
              . as $rows
              | ["TestScriptTiming", "TestScriptTiming/timing"] +
                (["sleep_other_flow", "concurrent_other_flow", "five_parallel", "reload_inflight", "nonblocking_parallel", "mtime_reload"]
                  | map("TestScriptTiming/timing/" + .)) as $expected
              | (reduce ($rows[] | select(.Test? != null and (.Action == "run" or .Action == "pass" or .Action == "fail" or .Action == "skip"))) as $event
                  ({}; .[$event.Test][$event.Action] = ((.[$event.Test][$event.Action] // 0) + 1))) as $counts
              | if (($counts | keys | sort) == ($expected | sort))
                  and all($counts[]; .run == $count and .pass == $count and (.fail // 0) == 0 and (.skip // 0) == 0)
                  and all($rows[] | select(.Test? != null or .Package? != null); .Package == "github.com/zchee/mitmproxy-go/script/acceptance")
                  and ([ $rows[] | select(.Package == "github.com/zchee/mitmproxy-go/script/acceptance" and .Test? == null and .Action == "start") ] | length) == 1
                  and ([ $rows[] | select(.Package == "github.com/zchee/mitmproxy-go/script/acceptance" and .Test? == null and .Action == "pass") ] | length) == 1
                  and ([ $rows[] | select(.Action == "fail" or .Action == "skip") ] | length) == 0
                then {terminals: 6, repetitions: $count, counts: $counts}
                else error("script timing parent/terminal identity or count mismatch") end
            ' "$OUT/timing-$count.jsonl" >| "$OUT/tallies-$count.json" 2>| "$OUT/reader-$count.stderr" || reader=$?
            printf 'end=%s\nproducer_exit=%s\nreader_exit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$producer" "$reader" >> "$OUT/command-$count.txt"
            (( producer == 0 )) || exit "$producer"
            (( reader == 0 )) || exit "$reader"
          done
      - name: Compile scripting timing contracts on macOS
        if: matrix.os == 'xcode-27'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/script/timing-compile"
          mkdir -p "$OUT"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/compile.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/compile.receipt"
            exit "$result"
          }
          trap finish EXIT
          go version >| "$OUT/go-version.txt"
          printf '%q ' go test -race -tags scripttiming -c -o "$RUNNER_TEMP/script-timing.test" ./script/acceptance >| "$OUT/command.txt"
          printf '\n' >> "$OUT/command.txt"
          go test -race -tags scripttiming -c -o "$RUNNER_TEMP/script-timing.test" ./script/acceptance >| "$OUT/compile.log" 2>| "$OUT/compile.stderr"
          shasum -a 256 "$RUNNER_TEMP/script-timing.test" >| "$OUT/binary.sha256"
      - name: Verify tagged scripting diagnostics
        if: matrix.os == 'ubuntu-26.04'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/script/quality"
          BINDIR="$RUNNER_TEMP/console-quality-tools"
          mkdir -p "$OUT"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/diagnostics.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/diagnostics.receipt"
            exit "$result"
          }
          trap finish EXIT
          timeout --signal=QUIT --kill-after=15s 3m go vet -tags scripttiming ./script/acceptance >| "$OUT/vet.log" 2>| "$OUT/vet.stderr"
          timeout --signal=QUIT --kill-after=15s 3m "$BINDIR/golangci-lint" run --allow-parallel-runners --issues-exit-code=1 --build-tags scripttiming ./script/acceptance >| "$OUT/lint.log" 2>| "$OUT/lint.stderr"
          GOFLAGS=-tags=scripttiming timeout --signal=QUIT --kill-after=15s 3m "$BINDIR/gopls" check script/acceptance/timing_test.go >| "$OUT/gopls.log" 2>| "$OUT/gopls.stderr"
          test ! -s "$OUT/gopls.log"
      - name: Upload scripting test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scripting-test-evidence-${{ matrix.os }}
          path: _test/script
          if-no-files-found: error
      - name: Upload console terminal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-terminal-evidence-${{ matrix.os }}
          path: _test/console
          if-no-files-found: error

  proxy-integration:
    name: proxy integration (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
        go:
          - stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: proxy-integration
      # Heap measurements exclude the race detector's allocation overhead.
      # The race-safe proxy tests already run in the test job above.
      - name: Proxy streaming integration tests
        run: go test -tags integration -count=1 ./internal/proxy/...
      - name: Verify executable SOCKS and transparent acceptance
        run: |
          set -euo pipefail
          names=(TestSocks5CLI TestTransparentCLI)
          pattern='^(TestSocks5CLI|TestTransparentCLI)$'
          mkdir -p _test/cli
          go test -tags integration -timeout=10m -list "${pattern}" ./cmd/mitmdump | tee _test/cli/inventory.txt
          diff -u <(printf '%s\n' "${names[@]}" | sort) <(grep '^Test' _test/cli/inventory.txt | sort)
          go test -tags integration -count=5 -cpu=1 -timeout=60m -v -run "${pattern}" ./cmd/mitmdump | tee _test/cli/acceptance.log
          if grep -Eq '^[[:space:]]*--- SKIP:' _test/cli/acceptance.log; then
            exit 1
          fi
          for name in "${names[@]}"; do
            test "$(grep -Ec "^--- PASS: ${name} " _test/cli/acceptance.log)" = 5
          done
      - name: Provision frozen sandboxed Chrome for mitmweb
        if: matrix.os == 'ubuntu-26.04'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/web/provision"
          mkdir -p "$OUT" "$GITHUB_WORKSPACE/_test/web/browser" "$GITHUB_WORKSPACE/_test/web/state" "$GITHUB_WORKSPACE/_test/web/storm"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/provision.receipt"
          finish() {
            local result=$1
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/provision.receipt"
            exit "$result"
          }
          trap 'finish "$?"' EXIT
          test "$(uname -m)" = x86_64
          test "$(id -u)" != 0
          uname -a >| "$OUT/kernel.txt"
          id -u >| "$OUT/effective-uid.txt"
          timeout --signal=QUIT --kill-after=15s 8m sudo apt-get update >| "$OUT/apt-update.log" 2>&1
          timeout --signal=QUIT --kill-after=15s 8m sudo apt-get install --no-install-recommends -y libnspr4 libnss3 >| "$OUT/apt-install.log" 2>&1
          dpkg-query --show --showformat='${Package}\t${Version}\n' libnspr4 libnss3 >| "$OUT/installed-libraries.txt"
          DOWNLOAD="$(mktemp -d "$RUNNER_TEMP/mitmweb-chrome-download.XXXXXXXX")"
          RUNTIME="$(mktemp -d "$RUNNER_TEMP/mitmweb-chrome-runtime.XXXXXXXX")"
          URL=https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.84/linux64/chrome-linux64.zip
          curl --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 120 --max-filesize 1048576 --output "$DOWNLOAD/version.json" https://googlechromelabs.github.io/chrome-for-testing/155.0.8059.84.json
          cp "$DOWNLOAD/version.json" "$OUT/version-metadata.json"
          jq -e --arg url "$URL" '.version == "155.0.8059.84" and ([.downloads.chrome[] | select(.platform == "linux64") | .url] == [$url])' "$OUT/version-metadata.json"
          curl --fail --silent --show-error --proto '=https' --connect-timeout 30 --max-time 600 --max-filesize 536870912 --output "$DOWNLOAD/chrome.zip" "$URL"
          printf '%s  %s\n' cf0f049892dea22e6a6db26d47ed0d7776b7158edcbec4634086633df8bafcbc "$DOWNLOAD/chrome.zip" | sha256sum --check
          printf '%s\n' "$URL" >| "$OUT/download-url.txt"
          sha256sum "$DOWNLOAD/chrome.zip" >| "$OUT/archive.sha256"
          python3 -I - "$DOWNLOAD/chrome.zip" "$RUNTIME" "$OUT/archive-members.txt" <<'PY'
          import pathlib
          import stat
          import sys
          import zipfile

          destination = pathlib.Path(sys.argv[2])
          names = set()
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = archive.infolist()
              assert len(entries) == 309
              assert sum(entry.file_size for entry in entries) == 417963103
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  mode = entry.external_attr >> 16
                  assert not path.is_absolute() and ".." not in path.parts
                  assert path.parts[0] == "chrome-linux64"
                  assert "\\" not in entry.filename
                  assert path.as_posix() == entry.filename.rstrip("/")
                  assert path not in names
                  assert stat.S_IFMT(mode) in (0, stat.S_IFREG, stat.S_IFDIR)
                  assert mode & 0o7000 == 0
                  assert entry.file_size <= 314572800
                  names.add(path)
              assert archive.testzip() is None
              archive.extractall(destination)
              for entry in entries:
                  if not entry.is_dir():
                      (destination / entry.filename).chmod(
                          (entry.external_attr >> 16) & 0o777 or 0o644
                      )
          pathlib.Path(sys.argv[3]).write_text(
              "".join(f"{name.as_posix()}\n" for name in sorted(names))
          )
          PY
          CHROME="$RUNTIME/chrome-linux64/chrome"
          DIGEST=b866a2964538c825538c454de4867973b926650da57ec12dc3328807d768247b
          printf '%s  %s\n' "$DIGEST" "$CHROME" | sha256sum --check
          sha256sum "$CHROME" >| "$OUT/executable.sha256"
          ldd "$CHROME" >| "$OUT/ldd.txt" 2>&1
          set +e
          grep -F 'not found' "$OUT/ldd.txt" >| "$OUT/missing-libraries.txt"
          result=$?
          set -e
          (( result == 1 )) || exit 1
          timeout --signal=QUIT --kill-after=15s 1m "$CHROME" --version >| "$OUT/chrome-version.txt" 2>| "$OUT/chrome-version.stderr"
          grep -Eq '^Google Chrome for Testing 155\.0\.8059\.84[[:space:]]*$' "$OUT/chrome-version.txt"
          SANDBOX="$RUNTIME/chrome-linux64/chrome_sandbox"
          test -f "$SANDBOX" && test ! -L "$SANDBOX"
          ls -l "$SANDBOX" >| "$OUT/sandbox-helper.before.txt"
          sha256sum "$SANDBOX" >| "$OUT/sandbox-helper.sha256"
          findmnt -T "$SANDBOX" -o TARGET,SOURCE,FSTYPE,OPTIONS >| "$OUT/sandbox-helper.mount.txt"
          MOUNT_OPTIONS="$(findmnt -T "$SANDBOX" -n -o OPTIONS)"
          case ",$MOUNT_OPTIONS," in
            *,nosuid,*)
              printf 'Chrome setuid sandbox helper is on a nosuid mount: %s\n' "$SANDBOX" >&2
              exit 1
              ;;
          esac
          mkdir -m 0700 "$RUNTIME/negative-nohelper-profile" "$RUNTIME/negative-unprivileged-profile"
          set +e
          timeout --signal=QUIT --kill-after=15s 1m /usr/bin/env -u CHROME_DEVEL_SANDBOX "$CHROME" --headless --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$RUNTIME/negative-nohelper-profile" --dump-dom about:blank >| "$OUT/sandbox-negative-nohelper.stdout" 2>| "$OUT/sandbox-negative-nohelper.stderr"
          result=$?
          set -e
          printf '%s\n' "$result" >| "$OUT/sandbox-negative-nohelper.exit"
          if (( result == 0 )); then
            printf 'Chrome unexpectedly launched without a usable sandbox helper\n' >&2
            exit 1
          fi
          grep -F 'No usable sandbox' "$OUT/sandbox-negative-nohelper.stderr"
          set +e
          timeout --signal=QUIT --kill-after=15s 1m /usr/bin/env CHROME_DEVEL_SANDBOX="$SANDBOX" "$CHROME" --headless --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$RUNTIME/negative-unprivileged-profile" --dump-dom about:blank >| "$OUT/sandbox-negative-unprivileged.stdout" 2>| "$OUT/sandbox-negative-unprivileged.stderr"
          result=$?
          set -e
          printf '%s\n' "$result" >| "$OUT/sandbox-negative-unprivileged.exit"
          if (( result == 0 )); then
            printf 'Chrome unexpectedly launched with an unprivileged sandbox helper\n' >&2
            exit 1
          fi
          grep -F 'The SUID sandbox helper binary was found, but is not configured correctly' "$OUT/sandbox-negative-unprivileged.stderr"
          sudo -n chown root:root -- "$SANDBOX"
          sudo -n chmod 4755 -- "$SANDBOX"
          ls -l "$SANDBOX" >| "$OUT/sandbox-helper.after.txt"
          test "$(stat -c '%u:%g:%a' "$SANDBOX")" = '0:0:4755'
          sha256sum --check "$OUT/sandbox-helper.sha256"
          CHROME_DEVEL_SANDBOX="$SANDBOX"
          export CHROME_DEVEL_SANDBOX
          mkdir -m 0700 "$RUNTIME/profile"
          timeout --signal=QUIT --kill-after=15s 1m "$CHROME" --headless --disable-gpu --no-first-run --no-default-browser-check --user-data-dir="$RUNTIME/profile" --dump-dom about:blank >| "$OUT/sandbox-dom.html" 2>| "$OUT/sandbox.stderr"
          grep -F '<html>' "$OUT/sandbox-dom.html"
          printf 'MITMPROXY_TEST_CHROME=%s\nMITMPROXY_TEST_CHROME_SHA256=%s\nCHROME_DEVEL_SANDBOX=%s\n' "$CHROME" "$DIGEST" "$SANDBOX" >> "$GITHUB_ENV"
          finish 0
      - name: Verify embedded mitmweb browser acceptance
        if: matrix.os == 'ubuntu-26.04'
        env:
          MITMPROXY_TEST_WEB_ARTIFACTS: ${{ github.workspace }}/_test/web/browser
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/web/browser"
          MITMPROXY_TEST_WEB_HEAD="$(git rev-parse HEAD)"
          export MITMPROXY_TEST_WEB_HEAD
          printf 'sha=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/browser.receipt"
          finish() {
            local result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/browser.receipt"
            exit "$result"
          }
          trap finish EXIT
          timeout --signal=QUIT --kill-after=15s 15m go test -tags browser -timeout=10m -list '^TestMitmwebBrowser$' ./internal/tools/web/acceptance >| "$OUT/inventory.txt"
          diff -u <(printf '%s\n' TestMitmwebBrowser) <(grep '^Test' "$OUT/inventory.txt")
          timeout --signal=QUIT --kill-after=15s 30m go test -tags browser -count=1 -cpu=1 -timeout=20m -json -run '^TestMitmwebBrowser$' ./internal/tools/web/acceptance >| "$OUT/browser.jsonl" 2>| "$OUT/browser.stderr.log"
      - name: Verify exact mitmweb browser identities
        if: matrix.os == 'ubuntu-26.04'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/web/browser"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/identity-reader.receipt"
          finish() {
            local result=$1
            trap - EXIT
            printf 'end=%s\nreader_exit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/identity-reader.receipt"
            exit "$result"
          }
          trap 'finish "$?"' EXIT
          jq -se --arg package github.com/zchee/mitmproxy-go/internal/tools/web/acceptance --arg parent TestMitmwebBrowser --argjson expected '["TestMitmwebBrowser","TestMitmwebBrowser/edit_and_replay"]' '
            . as $rows
            | [ $rows[]
                | select(.Package == $package and .Test? != null)
                | select(.Test == $parent or (.Test | startswith($parent + "/")))
                | select(.Action == "run" or .Action == "pass" or .Action == "fail" or .Action == "skip")
              ] as $events
            | reduce $events[] as $event
                ({}; .[$event.Test][$event.Action] = ((.[$event.Test][$event.Action] // 0) + 1)) as $counts
            | if (($counts | keys | sort) == ($expected | sort))
                 and all($counts[]; .run == 1 and .pass == 1 and (.fail // 0) == 0 and (.skip // 0) == 0)
                 and ([ $rows[] | select(.Package == $package and .Test? == null and .Action == "pass") ] | length) == 1
                 and ([ $rows[] | select(.Package == $package and .Test? == null and .Action == "fail") ] | length) == 0
              then {package: $package, expected: $expected, counts: $counts, verdict: "pass"}
              else error("mitmweb browser identity/count mismatch: \($counts)")
              end
          ' "$OUT/browser.jsonl" >| "$OUT/identity-tallies.json"
          finish 0
      - name: Verify mitmweb effective-uid state
        if: matrix.os == 'ubuntu-26.04'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/web/state"
          printf 'sha=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/state.receipt"
          finish() {
            local result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/state.receipt"
            exit "$result"
          }
          trap finish EXIT
          timeout --signal=QUIT --kill-after=15s 15m go build -o "$OUT/mitmweb" ./cmd/mitmweb
          timeout --signal=QUIT --kill-after=15s 15m go test -tags webprivileged -c -o "$OUT/web-state.test" ./internal/tools/web/acceptance
          timeout --signal=QUIT --kill-after=15s 15m "$OUT/web-state.test" -test.list '^TestMitmwebLocalModeUnavailable$' >| "$OUT/inventory.txt"
          diff -u <(printf '%s\n' TestMitmwebLocalModeUnavailable) <(grep '^Test' "$OUT/inventory.txt")
          test "$(id -u)" != 0
          timeout --signal=QUIT --kill-after=15s 15m /usr/bin/env MITMPROXY_TEST_MITMWEB="$OUT/mitmweb" MITMPROXY_TEST_WEB_ROLE=nonroot "$OUT/web-state.test" -test.run '^TestMitmwebLocalModeUnavailable$' -test.count=1 -test.timeout=10m -test.v >| "$OUT/nonroot.log" 2>| "$OUT/nonroot.stderr.log"
          timeout --signal=QUIT --kill-after=15s 15m sudo -n /usr/bin/env MITMPROXY_TEST_MITMWEB="$OUT/mitmweb" MITMPROXY_TEST_WEB_ROLE=root "$OUT/web-state.test" -test.run '^TestMitmwebLocalModeUnavailable$' -test.count=1 -test.timeout=10m -test.v >| "$OUT/root.log" 2>| "$OUT/root.stderr.log"
          for role in nonroot root; do
            grep -Eq '^--- PASS: TestMitmwebLocalModeUnavailable ' "$OUT/$role.log"
            set +e
            grep -Eq -- '--- (SKIP|FAIL):' "$OUT/$role.log"
            reader=$?
            set -e
            (( reader != 0 )) || exit 1
            (( reader == 1 )) || exit "$reader"
            grep -F "role=$role source=os.Geteuid" "$OUT/$role.log"
          done
      - name: Verify isolated mitmweb update storm
        if: matrix.os == 'ubuntu-26.04'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/web/storm"
          printf 'sha=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/storm.receipt"
          finish() {
            local result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/storm.receipt"
            exit "$result"
          }
          trap finish EXIT
          timeout --signal=QUIT --kill-after=15s 15m go test -tags webstorm -timeout=10m -list '^TestWebUpdateStorm$' ./internal/tools/web/updates >| "$OUT/inventory.txt"
          diff -u <(printf '%s\n' TestWebUpdateStorm) <(grep '^Test' "$OUT/inventory.txt")
          timeout --signal=QUIT --kill-after=15s 15m go test -tags webstorm -count=5 -cpu=1 -timeout=10m -json -run '^TestWebUpdateStorm$' ./internal/tools/web/updates >| "$OUT/storm.jsonl" 2>| "$OUT/storm.stderr.log"
          jq -se '([.[] | select(.Test == "TestWebUpdateStorm/nonreader_peer_close" and .Action == "run")] | length) == 5 and ([.[] | select(.Test == "TestWebUpdateStorm/nonreader_peer_close" and .Action == "pass")] | length) == 5 and ([.[] | select(.Action == "fail" or .Action == "skip")] | length) == 0' "$OUT/storm.jsonl"
      - name: Upload mitmweb browser state and storm evidence
        if: always() && matrix.os == 'ubuntu-26.04'
        uses: actions/upload-artifact@v7
        with:
          name: mitmweb-linux-evidence
          path: _test/web
          if-no-files-found: error

  ldap-integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: integration-password
          LDAP_TLS: "false"
        ports:
          - 389/tcp
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: ldap-integration
      - name: Verify SOCKS LDAP acceptance inventory
        run: |
          set -euo pipefail
          listed="$(go test -race -tags integration -list '^TestSocks5LDAP$' ./addons/proxyauth)"
          diff -u <(printf '%s\n' TestSocks5LDAP) <(grep '^Test' <<<"${listed}")
      - name: Authenticate against OpenLDAP
        env:
          MITMPROXY_TEST_LDAP_ADDRESS: 127.0.0.1:${{ job.services.openldap.ports['389'] }}
        run: go test -race -tags integration -count=1 -v ./addons/proxyauth

  gotip:
    name: build and test (gotip)
    runs-on: ubuntu-26.04
    # The development toolchain may break for reasons outside this module;
    # a failure here is a warning, not a gate.
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Bootstrap toolchain that builds gotip from source.
          go-version: stable
      - name: Install gotip
        run: |
          go install golang.org/dl/gotip@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Date for the toolchain cache key
        id: date
        run: echo "today=$(date -u '+%Y-%m-%d')" >> "${GITHUB_OUTPUT}"
      # The development toolchain changes daily; a same-day hit skips the
      # two-minute source build, and gotip download is a no-op on a hit.
      - uses: actions/cache@v6
        with:
          path: ~/sdk/gotip
          key: gotip-${{ runner.os }}-${{ steps.date.outputs.today }}
      - name: Download and build the development toolchain
        run: gotip download
      - name: gotip build, vet and test
        run: |
          gotip version
          gotip build ./...
          gotip vet ./...
          gotip test -race -count=1 ./...

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      # Files behind the difftest build tag are invisible to the run above,
      # and internal/difftest has a "!difftest" file that a tagged run
      # alone would skip, so both runs are needed.
      - name: golangci-lint (difftest build tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          args: --build-tags difftest
          skip-save-cache: true
      - name: Skip-report shell contracts
        run: bash hack/test-skips_test.sh

  fuzz-smoke:
    name: fuzz-smoke (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: fuzz-smoke
      - name: Verify required protocol fuzz targets
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          while read -r pkg target; do
            listed="$(go test -list "^${target}$" "${pkg}")"
            grep -Fx -- "${target}" <<<"${listed}" || {
              echo "required fuzz target ${pkg} ${target} is absent" >&2
              exit 1
            }
          done <<'TARGETS'
          ./dns FuzzUnpack
          ./tlsparse FuzzQUICClientHello
          ./internal/h3 FuzzHeaders
          ./internal/proxy/layers/socks5 FuzzSOCKS5Handshake
          TARGETS
      - name: Verify required mitmweb fuzz targets
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          while read -r pkg target; do
            listed="$(timeout --signal=QUIT --kill-after=15s 15m go test -timeout=10m -list "^${target}$" "$pkg")"
            printf '%s\n' "$listed"
            grep -Fx -- "$target" <<< "$listed" || {
              printf 'required fuzz target %s %s is absent\n' "$pkg" "$target" >&2
              exit 1
            }
          done <<'TARGETS'
          ./internal/tools/web/webauth FuzzWebAuthTokens
          ./internal/tools/web/webauth FuzzWebPasswordHash
          ./internal/tools/web/updates FuzzWebUpdateMessage
          ./internal/tools/web/updates FuzzWebUpdateFilter
          ./internal/tools/web FuzzWebJSON
          ./internal/tools/web FuzzWebUpload
          TARGETS
      - name: Verify required console fuzz targets
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          while read -r pkg target; do
            listed="$(timeout --signal=QUIT --kill-after=15s 15m go test -timeout=10m -list "^${target}$" "$pkg")"
            printf '%s\n' "$listed"
            grep -Fx -- "$target" <<< "$listed"
          done <<'TARGETS'
          ./internal/tools/console/keymap FuzzConsoleKeysYAML
          ./internal/tools/console/grideditor FuzzConsoleGridEscaped
          ./internal/tools/console/external FuzzConsoleEditorArgv
          ./internal/tools/console/commander FuzzConsoleCommander
          ./internal/tools/console/commander FuzzConsoleFilterInput
          TARGETS
      - name: Verify required scripting fuzz targets
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/script/fuzz"
          mkdir -p "$OUT"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/discovery.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/discovery.receipt"
            exit "$result"
          }
          trap finish EXIT
          for target in FuzzScriptSource FuzzScriptBindings FuzzScriptHTTPGetResponse; do
            timeout --signal=QUIT --kill-after=15s 15m go test -timeout=10m -list "^${target}$" ./script >| "$OUT/$target-parents.txt" 2>| "$OUT/$target.stderr"
            diff -u <(printf '%s\n' "$target") <(grep '^Fuzz' "$OUT/$target-parents.txt")
          done
      - name: Upload scripting fuzz discovery evidence
        if: always() && matrix.shard == 0
        uses: actions/upload-artifact@v7
        with:
          name: scripting-fuzz-discovery
          path: _test/script
          if-no-files-found: error
      - name: Run every fuzz target for 30 seconds
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          set -euo pipefail
          # go test -fuzz accepts one package and one target per run, so
          # loop over the targets each package lists. Assigning the output
          # to a variable first makes a compile error fail the job. Targets
          # are dealt round-robin across the shards so each runner takes a
          # quarter of the 30-second runs.
          pkgs="$(go list ./...)"
          count=0
          index=0
          for pkg in ${pkgs}; do
            listed="$(go test -list '^Fuzz' "${pkg}")"
            for target in $(grep '^Fuzz' <<<"${listed}" || true); do
              if [ $((index % SHARDS)) -eq "${SHARD}" ]; then
                echo "::group::${pkg} ${target}"
                go test -run '^$' -fuzz "^${target}\$" -fuzztime 30s "${pkg}"
                echo "::endgroup::"
                count=$((count + 1))
              fi
              index=$((index + 1))
            done
          done
          echo "shard ${SHARD}/${SHARDS} ran ${count} of ${index} fuzz target(s)"

  licenses:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: licenses
      - name: Install go-licenses
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Reject GPL, LGPL, AGPL, MPL and unclassified licences
        run: |
          # GPL and LGPL are "restricted", AGPL is "forbidden" and MPL is
          # "reciprocal" in go-licenses. Each GOOS is checked because some
          # dependencies are imported on one platform only.
          # Chroma is MIT; its combined notice also covers an OFL font in
          # formatters/svg, which is not imported. Retire this classifier
          # exception when Chroma separates the font notice or go-licenses
          # correctly handles the combined notices.
          for goos in linux darwin windows; do
            echo "::group::GOOS=${goos}"
            GOOS="${goos}" go-licenses check ./... --ignore github.com/alecthomas/chroma/v2 --disallowed_types=forbidden,restricted,reciprocal,unknown
            echo "::endgroup::"
          done

  difftest:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: difftest
      # setup-uv has published no floating major tag since v8, so this pins
      # the full version and dependabot bumps it. Switch to "@vN" if upstream
      # publishes major tags again.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # The uv cache depends on the pinned mitmproxy commit, which the
          # inline script metadata of the oracle scripts and the difftest
          # runner declare; the default globs match no file here.
          cache-dependency-glob: |
            **/testdata/*.py
            internal/difftest/difftest.go
      - name: Verify highlight golden generator
        run: |
          set -euo pipefail
          R="$GITHUB_WORKSPACE"
          OUT="$R/_test/highlight-generator"
          export PYTHONDONTWRITEBYTECODE=1
          mkdir -p "$OUT"
          trap 'status=$?; shopt -s nullglob; files=("$OUT"/*.log "$OUT"/*.receipt "$OUT"/*.xml "$OUT"/generated/*.json); sha256sum "${files[@]}" >| "$OUT/SHA256SUMS"; exit "$status"' EXIT
          receipt() {
            local name="$1"
            shift
            printf 'sha: %s\nhost: %s\nstart: %s\ncommand:' "$(git rev-parse HEAD)" "$(hostname)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/$name.receipt"
            printf ' %q' "$@" >> "$OUT/$name.receipt"
            printf '\n' >> "$OUT/$name.receipt"
            set +e
            "$@" >| "$OUT/$name.log" 2>| "$OUT/$name.stderr.log"
            local result=$?
            set -e
            printf 'end: %s\nexit: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/$name.receipt"
            return "$result"
          }
          receipt collection timeout --signal=QUIT --kill-after=15s 15m uv run --no-project --python 3.13 --with mitmproxy_rs==0.12.11 --with pytest==9.1.1 python -m pytest -q --collect-only "$R/hack/test_generate_highlight_goldens.py"
          receipt tests timeout --signal=QUIT --kill-after=15s 15m uv run --no-project --python 3.13 --with mitmproxy_rs==0.12.11 --with pytest==9.1.1 python -m pytest -q "$R/hack/test_generate_highlight_goldens.py" -rA --junitxml="$OUT/highlight-generator.xml"
          receipt generation timeout --signal=QUIT --kill-after=15s 30m uv run --no-project --python 3.13 --with mitmproxy_rs==0.12.11 python "$R/hack/generate-highlight-goldens.py" --inputs "$R/testdata/highlight/inputs" --output "$OUT/generated"
          receipt frozen-comparison cmp "$R/testdata/highlight/goldens.json" "$OUT/generated/goldens.json"
          receipt inventory-validation uv run --no-project --python 3.13 python - "$OUT" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          output = Path(sys.argv[1])
          expected = {
              "test_missing_input",
              "test_extra_input",
              "test_duplicate_identity",
              "test_wrong_language",
              "test_invalid_schema",
              "test_source_span_mismatch",
              "test_input_digest_mismatch",
              "test_wheel_version_mismatch",
              "test_wheel_digest_mismatch",
              "test_source_pin_mismatch",
              "test_lock_table_mismatch",
              "test_chunk_reconstruction_mismatch",
              "test_invalid_tag",
              "test_invalid_sample_line_count",
              "test_deterministic_generation",
              "test_provenance_roundtrip",
          }
          collection = (output / "collection.log").read_text().splitlines()
          identities = [line for line in collection if "::test_" in line]
          wanted = {f"hack/test_generate_highlight_goldens.py::{name}" for name in expected}
          assert len(identities) == 16 and set(identities) == wanted, identities
          cases = ET.parse(output / "highlight-generator.xml").findall(".//testcase")
          assert len(cases) == 16 and {case.attrib["name"] for case in cases} == expected
          assert all(not list(case) for case in cases), "skips, failures or errors present"
          log = (output / "tests.log").read_text().lower()
          assert not any(word in log for word in ("xfailed", "xpassed", "deselected"))
          sys.stdout.write("16 exact identities collected; 16 passed; zero skips/errors/failures/xfail/xpass/deselection.\n")
          PY
      - name: Upload highlight generator evidence
        if: always()
        uses: actions/upload-artifact@v7
