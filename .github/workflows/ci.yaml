name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Windows runners default to pwsh; every step is written for bash.
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
          - windows-2025
        go:
          - stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: build
      - name: go build and go vet
        run: go build ./... && go vet ./...

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
          - windows-2025
        go:
          - stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: test
      - name: go test -race with skip report
        env:
          TEST_SKIPS_ENFORCE: ${{ vars.TEST_SKIPS_ENFORCE || '0' }}
        run: |
          set -euo pipefail
          go test -race -count=1 -json ./... | bash hack/test-skips.sh

  stress:
    name: stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
          - windows-2025
    runs-on: ${{ matrix.os }}
    # Five 60-minute row budgets plus toolchain setup and artifact upload.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: stress
      - name: Named race stress rows
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p stress-logs
          cp hack/stress-rows.txt stress-logs/
          row=0
          # An empty match is accepted until the upstream-sequence tests land.
          while IFS=$'\t' read -r pkg pattern count cpu; do
            row=$((row + 1))
            echo "::group::${pkg} ${pattern}"
            {
              date '+%Y-%m-%d %H:%M:%S %Z'
              printf 'candidate_sha=%s\ncheckout_sha=%s\n' "${CANDIDATE_SHA}" "$(git rev-parse HEAD)"
              go version
              printf 'go test -race -count=%s -cpu=%s -timeout=60m -run %q %q\n' \
                "${count}" "${cpu}" "${pattern}" "${pkg}"
              go test -race -count="${count}" -cpu="${cpu}" -timeout=60m -v -run "${pattern}" "${pkg}"
            } 2>&1 | tee "stress-logs/${row}.log"
            echo "::endgroup::"
          done < hack/stress-rows.txt
      - name: Upload exact-head stress logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: stress-logs/
          if-no-files-found: error

  proxy-integration:
    name: proxy integration (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - xcode-27
        go:
          - stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: proxy-integration
      # Heap measurements exclude the race detector's allocation overhead.
      # The race-safe proxy tests already run in the test job above.
      - name: Proxy streaming integration tests
        run: go test -tags integration -count=1 ./internal/proxy/...

  ldap-integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    services:
      openldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_DOMAIN: example.org
          LDAP_ADMIN_PASSWORD: integration-password
          LDAP_TLS: "false"
        ports:
          - 389/tcp
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: ldap-integration
      - name: Authenticate against OpenLDAP
        env:
          MITMPROXY_TEST_LDAP_ADDRESS: 127.0.0.1:${{ job.services.openldap.ports['389'] }}
        run: go test -race -tags integration -count=1 -v ./addons/proxyauth

  gotip:
    name: build and test (gotip)
    runs-on: ubuntu-26.04
    # The development toolchain may break for reasons outside this module;
    # a failure here is a warning, not a gate.
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Bootstrap toolchain that builds gotip from source.
          go-version: stable
      - name: Install gotip
        run: |
          go install golang.org/dl/gotip@latest
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Download and build the development toolchain
        run: gotip download
      - name: gotip build, vet and test
        run: |
          gotip version
          gotip build ./...
          gotip vet ./...
          gotip test -race -count=1 ./...

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: lint
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      # Files behind the difftest build tag are invisible to the run above,
      # and internal/difftest has a "!difftest" file that a tagged run
      # alone would skip, so both runs are needed.
      - name: golangci-lint (difftest build tag)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          args: --build-tags difftest
          skip-save-cache: true
      - name: Skip-report shell contracts
        run: bash hack/test-skips_test.sh

  fuzz-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: fuzz-smoke
      - name: Verify required protocol fuzz targets
        run: |
          set -euo pipefail
          while read -r pkg target; do
            listed="$(go test -list "^${target}$" "${pkg}")"
            grep -Fx -- "${target}" <<<"${listed}" || {
              echo "required fuzz target ${pkg} ${target} is absent" >&2
              exit 1
            }
          done <<'TARGETS'
          ./dns FuzzUnpack
          ./tlsparse FuzzQUICClientHello
          ./internal/h3 FuzzHeaders
          TARGETS
      - name: Run every fuzz target for 30 seconds
        run: |
          set -euo pipefail
          # go test -fuzz accepts one package and one target per run, so
          # loop over the targets each package lists. Assigning the output
          # to a variable first makes a compile error fail the job.
          pkgs="$(go list ./...)"
          count=0
          for pkg in ${pkgs}; do
            listed="$(go test -list '^Fuzz' "${pkg}")"
            for target in $(grep '^Fuzz' <<<"${listed}" || true); do
              echo "::group::${pkg} ${target}"
              go test -run '^$' -fuzz "^${target}\$" -fuzztime 30s "${pkg}"
              echo "::endgroup::"
              count=$((count + 1))
            done
          done
          echo "ran ${count} fuzz target(s)"

  licenses:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: licenses
      - name: Install go-licenses
        run: |
          go install github.com/google/go-licenses/v2@v2.0.1
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Reject GPL, LGPL, AGPL, MPL and unclassified licences
        run: |
          # GPL and LGPL are "restricted", AGPL is "forbidden" and MPL is
          # "reciprocal" in go-licenses. Each GOOS is checked because some
          # dependencies are imported on one platform only.
          for goos in linux darwin windows; do
            echo "::group::GOOS=${goos}"
            GOOS="${goos}" go-licenses check ./... --disallowed_types=forbidden,restricted,reciprocal,unknown
            echo "::endgroup::"
          done

  difftest:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: difftest
      # setup-uv has published no floating major tag since v8, so this pins
      # the full version and dependabot bumps it. Switch to "@vN" if upstream
      # publishes major tags again.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # The uv cache depends on the pinned mitmproxy commit, which the
          # inline script metadata of the oracle scripts and the difftest
          # runner declare; the default globs match no file here.
          cache-dependency-glob: |
            **/testdata/*.py
            internal/difftest/difftest.go
      - name: Differential tests against the pinned Python mitmproxy
        run: go test -tags difftest -count=1 ./...
