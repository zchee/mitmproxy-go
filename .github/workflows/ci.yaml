          timeout --signal=QUIT --kill-after=15s 15m go test -tags difftest -timeout=10m -list '^TestDifferentialAddonListings$' ./cmd/mitmdump >| "$OUT/parents.txt" 2>| "$OUT/parents.stderr"
          diff -u <(printf '%s\n' TestDifferentialAddonListings) <(grep '^Test' "$OUT/parents.txt")
          printf 'end=%s\nexit=0\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$OUT/inventory.receipt"
      - name: Differential tests against the pinned Python mitmproxy
        env:
          MITMPROXY_TEST_WEB_ARTIFACTS: ${{ github.workspace }}/_test/web-differential/processes
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/web-differential"
          mkdir -p "$OUT"
          printf 'checkout=%s\nstart=%s\ncommand=go test -json -tags difftest -count=1 ./...\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/all-tagged.receipt"
          finish() {
            local result=$1
            trap - EXIT
            printf 'end=%s\nexit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/all-tagged.receipt"
            exit "$result"
          }
          trap 'finish "$?"' EXIT
          set +e
          go test -json -tags difftest -count=1 ./... 2>| "$OUT/all-tagged.stderr.log" | tee "$OUT/all-tagged.jsonl"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'producer_exit=%s\ntee_exit=%s\n' "${statuses[0]}" "${statuses[1]}" >> "$OUT/all-tagged.receipt"
          if (( statuses[0] != 0 )); then
            finish "${statuses[0]}"
          fi
          finish "${statuses[1]}"
      - name: Verify live script addon listing evidence
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/_test/script/differential"
          printf 'checkout=%s\nstart=%s\n' "$(git rev-parse HEAD)" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >| "$OUT/reader.receipt"
          finish() {
            result=$?
            trap - EXIT
            printf 'end=%s\nreader_exit=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$result" >> "$OUT/reader.receipt"
            exit "$result"
          }
          trap finish EXIT
          jq -se '
            . as $rows
            | [ $rows[] | select(.Package == "github.com/zchee/mitmproxy-go/cmd/mitmdump" and .Test? != null)
                | select(.Test == "TestDifferentialAddonListings" or (.Test | startswith("TestDifferentialAddonListings/")))
                | select(.Action == "run" or .Action == "pass" or .Action == "fail" or .Action == "skip") ] as $events
            | (reduce $events[] as $event ({}; .[$event.Test][$event.Action] = ((.[$event.Test][$event.Action] // 0) + 1))) as $counts
            | if (($counts | keys) == ["TestDifferentialAddonListings"])
                and all($counts[]; .run == 1 and .pass == 1 and (.fail // 0) == 0 and (.skip // 0) == 0)
                and ([ $rows[] | select(.Package == "github.com/zchee/mitmproxy-go/cmd/mitmdump" and .Test? == null and .Action == "start") ] | length) == 1
                and ([ $rows[] | select(.Package == "github.com/zchee/mitmproxy-go/cmd/mitmdump" and .Test? == null and .Action == "pass") ] | length) == 1
                and ([ $rows[] | select(.Package == "github.com/zchee/mitmproxy-go/cmd/mitmdump" and .Test? == null and .Action == "skip") ] | length) == 0
                and ([ $rows[] | select(.Action == "fail") ] | length) == 0
              then {terminals: 1, counts: $counts}
              else error("live script addon listing is absent, skipped or failed") end
          ' "$GITHUB_WORKSPACE/_test/web-differential/all-tagged.jsonl" >| "$OUT/tallies.json"
      - name: Upload scripting differential evidence
