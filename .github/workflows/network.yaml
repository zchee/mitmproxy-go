name: Network gates

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  network-gates:
    name: isolated network gates
    runs-on: ubuntu-26.04
    # Scenario deadlines total 55 minutes; setup and evidence upload need margin.
    timeout-minutes: 75
    env:
      NETWORK_GATE_OUTPUT: ${{ github.workspace }}/_test/network-gate
      HTTP_LOAD_TAG: h2load
      HTTP_LOAD_PACKAGE: ./internal/proxy/layers/httplayer
      HTTP_LOAD_ENV_NAME: MITMPROXY_GO_HTTP2_LOAD
      HTTP_LOAD_ENV_VALUE: "1"
      HTTP_TRANSFER_TEST: TestHTTP2LoadLargeTransfer
      HTTP_UNRELATED_TEST: TestHTTP2LoadUnrelatedResponse
      HTTP3_TRANSFER_TEST: TestHTTP3LoadLargeTransfer
      HTTP3_UNRELATED_TEST: TestHTTP3LoadUnrelatedResponse
      HTTP_HEAP_TEST: TestHTTP2LoadHeapStalls
      HTTP_SMALL_FRAME_HEAP_TEST: TestHTTP2LoadHeapSmallWindow
      HTTP_SSE_TEST: TestHTTP2LoadSSELatency
      WS_GATE_RUNNER: internal/proxy/layers/websocket/autobahn/run.sh
      WS_CASE_MANIFEST: internal/proxy/layers/websocket/autobahn/cases.json
      WS_GATE_CONFIG: internal/proxy/layers/websocket/autobahn/fuzzingclient.json
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: network-gates
      - name: Test incomplete gate configurations
        run: bash hack/network-gate_test.sh
      - name: Install network tools
        run: |
          set -euo pipefail
          mkdir -p "${NETWORK_GATE_OUTPUT}"
          exec > >(tee "${NETWORK_GATE_OUTPUT}/setup.log") 2>&1
          set -x
          date -u '+%Y-%m-%dT%H:%M:%SZ'
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes iproute2 jq
          if ! command -v docker; then
            sudo apt-get install --no-install-recommends --yes docker.io
          fi
          sudo systemctl start docker
          docker info
          free -m >| "${NETWORK_GATE_OUTPUT}/host-memory-before.txt" 2>&1 || true
          swapon --show >| "${NETWORK_GATE_OUTPUT}/swap-before.txt" 2>&1 || true
          df -h "${GITHUB_WORKSPACE}" >| "${NETWORK_GATE_OUTPUT}/disk-before.txt" 2>&1 || true
      - name: Run isolated acceptance measurements
        run: bash hack/network-gate.sh
      - name: Capture runner resource diagnostics
        if: always()
        run: |
          mkdir -p "${NETWORK_GATE_OUTPUT}"
          date -u '+%Y-%m-%dT%H:%M:%SZ' >| "${NETWORK_GATE_OUTPUT}/resource-snapshot.txt"
          free -m >| "${NETWORK_GATE_OUTPUT}/host-memory-after.txt" 2>&1 || true
          swapon --show >| "${NETWORK_GATE_OUTPUT}/swap-after.txt" 2>&1 || true
          df -h "${GITHUB_WORKSPACE}" >| "${NETWORK_GATE_OUTPUT}/disk-after.txt" 2>&1 || true
          sudo journalctl -k -n 200 --no-pager >| "${NETWORK_GATE_OUTPUT}/kernel.log" 2>&1 || true
          sudo journalctl -u systemd-oomd -n 50 --no-pager >| "${NETWORK_GATE_OUTPUT}/oomd.log" 2>&1 || true
          systemctl status systemd-oomd --no-pager >| "${NETWORK_GATE_OUTPUT}/oomd-status.txt" 2>&1 || true
          docker stats --no-stream >| "${NETWORK_GATE_OUTPUT}/docker-stats.txt" 2>&1 || true
      - name: Upload measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: _test/network-gate
          if-no-files-found: error
          retention-days: 14

  netem:
    name: netem throughput
    runs-on: ubuntu-26.04
    # Two 600-second attempts plus setup, restoration and separate uploads.
    timeout-minutes: 30
    env:
      NETWORK_GATE_OUTPUT: ${{ github.workspace }}/_test/netem
      HTTP_LOAD_TAG: h2load
      HTTP_LOAD_PACKAGE: ./internal/proxy/layers/httplayer
      HTTP_LOAD_ENV_NAME: MITMPROXY_GO_HTTP2_LOAD
      HTTP_LOAD_ENV_VALUE: "1"
      HTTP_NETEM_TEST: TestHTTP2LoadNetem
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: netem-throughput
      - name: Install network tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes iproute2 jq
      - name: Run first isolated measurement
        id: first
        run: bash hack/network-gate.sh --netem-first
      - name: Retain first-attempt evidence before any retry
        id: first-upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netem-first-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _test/netem
          if-no-files-found: error
          retention-days: 14
      - name: Retry only a validated measurement failure
        if: steps.first.outputs.classification == 'retryable' && steps.first-upload.outcome == 'success' && success()
        run: bash hack/network-gate.sh --netem-retry
      - name: Upload retry evidence separately
        if: always() && steps.first.outputs.classification == 'retryable'
        uses: actions/upload-artifact@v7
        with:
          name: netem-retry-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: _test/netem/retry
          if-no-files-found: error
          retention-days: 14
      - name: Require an accepted measurement receipt
        if: always()
        run: |
          set -euo pipefail
          first="$(jq -er '.classification' "${NETWORK_GATE_OUTPUT}/first/receipt.json")"
          if [[ "${first}" == pass ]]; then
            exit 0
          fi
          [[ "${first}" == retryable ]]
          jq -e '.classification == "pass"' "${NETWORK_GATE_OUTPUT}/retry/receipt.json"
          echo 'accepted flaky measurement under the approved two-attempt policy'
