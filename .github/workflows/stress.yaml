name: Stress

# Named race stress rows (hack/stress-rows.txt) on every supported platform.
# They run nightly on main and on demand; a pull request runs them only when
# it carries the "stress" label or changes a package that a row covers, so
# routine changes are not held for the slowest row. The path check sees the
# row's own package, not its dependencies: a change to a package those rows
# import (internal/proxy/layer, internal/netstack, ...) needs the label.
#
# Linux and Windows run one job per row, so the longest row bounds the wall
# clock. macOS runs every row in one job: the hosted xcode-27 pool hands out
# very few runners at a time (one, on 2026-10-10), so seven macOS jobs would
# queue behind each other, pay the toolchain setup seven times and starve
# the gating test jobs that share the pool.

on:
  schedule:
    # 18:00 UTC is 03:00 JST.
    - cron: "0 18 * * *"
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Windows runners default to pwsh; every step is written for bash.
    shell: bash

jobs:
  plan:
    name: stress plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull-request diff below needs the base commit.
          fetch-depth: 0
      - name: Decide whether a pull request runs the rows
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "pull_request" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "scheduled or manual run: every row"
            exit 0
          fi
          for label in ${LABELS}; do
            if [ "${label}" = "stress" ]; then
              echo "run=true" >> "${GITHUB_OUTPUT}"
              echo "label stress: every row"
              exit 0
            fi
          done
          # A change under a row's package, to the row list, or to this
          # workflow runs the rows; anything else skips them.
          changed="$(git diff --name-only "${BASE_SHA}...HEAD")"
          echo "${changed}"
          watched='^(hack/stress-rows\.txt|\.github/workflows/stress\.yaml|go\.mod|go\.sum)$'
          while IFS=$'\t' read -r pkg _; do
            dir="${pkg#./}"
            watched="${watched}|^${dir}/"
          done < hack/stress-rows.txt
          if grep -Eq "${watched}" <<<"${changed}"; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            echo "a covered package changed: every row"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "no covered package changed: rows skipped (add the stress label to force them)"
          fi
      - name: Read the stress rows into a matrix
        id: rows
        env:
          RUN: ${{ steps.gate.outputs.run }}
        run: |
          set -euo pipefail
          if [ "${RUN}" != "true" ]; then
            echo "rows=[]" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # One job per row: the longest row bounds the wall clock, not the sum.
          rows="$(awk -F'\t' 'NF == 4 { printf "%s{\"id\":%d,\"pkg\":\"%s\",\"pattern\":\"%s\",\"count\":\"%s\",\"cpu\":\"%s\"}", (NR > 1 ? "," : ""), NR, $1, $2, $3, $4 }' hack/stress-rows.txt)"
          echo "rows=[${rows}]" >> "${GITHUB_OUTPUT}"
          echo "[${rows}]"

  stress:
    name: stress (${{ matrix.os }}, row ${{ matrix.row.id }})
    needs: plan
    if: needs.plan.outputs.rows != '[]'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-2025
        row: ${{ fromJSON(needs.plan.outputs.rows) }}
    runs-on: ${{ matrix.os }}
    # One 60-minute row budget plus toolchain setup and artifact upload.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: stress
      - name: Named race stress row
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ROW_ID: ${{ matrix.row.id }}
          ROW_PKG: ${{ matrix.row.pkg }}
          ROW_PATTERN: ${{ matrix.row.pattern }}
          ROW_COUNT: ${{ matrix.row.count }}
          ROW_CPU: ${{ matrix.row.cpu }}
        run: |
          set -euo pipefail
          mkdir -p stress-logs
          cp hack/stress-rows.txt stress-logs/
          # An empty match is accepted until the upstream-sequence tests land.
          {
            date '+%Y-%m-%d %H:%M:%S %Z'
            printf 'candidate_sha=%s\ncheckout_sha=%s\n' "${CANDIDATE_SHA}" "$(git rev-parse HEAD)"
            go version
            printf 'go test -race -count=%s -cpu=%s -timeout=60m -run %q %q\n' \
              "${ROW_COUNT}" "${ROW_CPU}" "${ROW_PATTERN}" "${ROW_PKG}"
            go test -race -count="${ROW_COUNT}" -cpu="${ROW_CPU}" -timeout=60m -v -run "${ROW_PATTERN}" "${ROW_PKG}"
          } 2>&1 | tee "stress-logs/${ROW_ID}.log"
      - name: Upload exact-head stress log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-${{ matrix.os }}-row${{ matrix.row.id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: stress-logs/
          if-no-files-found: error

  stress-macos:
    name: stress (xcode-27, every row)
    needs: plan
    if: needs.plan.outputs.rows != '[]'
    runs-on: xcode-27
    # Seven 60-minute row budgets plus toolchain setup and artifact upload.
    timeout-minutes: 450
    steps:
      - uses: actions/checkout@v7
      - name: Read the Go version from go.mod
        id: go
        shell: bash
        run: echo "version=$(sed -n 's/^go \([0-9][0-9.]*\)$/\1/p' go.mod)" >> "$GITHUB_OUTPUT"
      - uses: cloudx-io/setup-go@v1
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-key-prefix: stress
      - name: Named race stress rows
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          mkdir -p stress-logs
          cp hack/stress-rows.txt stress-logs/
          row=0
          failed=""
          # Every row runs even after an earlier one fails, so one red row
          # cannot hide the result of the rows behind it; the job fails at
          # the end. An empty match is accepted until the upstream-sequence
          # tests land.
          while IFS=$'\t' read -r pkg pattern count cpu; do
            row=$((row + 1))
            echo "::group::${pkg} ${pattern}"
            {
              date '+%Y-%m-%d %H:%M:%S %Z'
              printf 'candidate_sha=%s\ncheckout_sha=%s\n' "${CANDIDATE_SHA}" "$(git rev-parse HEAD)"
              go version
              printf 'go test -race -count=%s -cpu=%s -timeout=60m -run %q %q\n' \
                "${count}" "${cpu}" "${pattern}" "${pkg}"
              go test -race -count="${count}" -cpu="${cpu}" -timeout=60m -v -run "${pattern}" "${pkg}"
            } 2>&1 | tee "stress-logs/${row}.log"
            if [ "${PIPESTATUS[0]}" -ne 0 ]; then
              failed="${failed} ${row}"
              echo "::error::stress row ${row} (${pkg} ${pattern}) failed"
            fi
            echo "::endgroup::"
          done < hack/stress-rows.txt
          if [ -n "${failed}" ]; then
            echo "failed rows:${failed}" >&2
            exit 1
          fi
      - name: Upload exact-head stress logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-xcode-27-${{ github.event.pull_request.head.sha || github.sha }}
          path: stress-logs/
          if-no-files-found: error
